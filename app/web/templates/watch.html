<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ file_name }} — ⚡ MMW Stream Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="w-full border-b border-slate-800 px-4 py-3 flex items-center justify-between bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
        <div class="flex items-center space-x-3 overflow-hidden">
            <span class="bg-sky-500 text-white p-2 rounded-xl text-sm flex items-center justify-center w-9 h-9">
                <i class="fa-solid fa-play"></i>
            </span>
            <h1 class="font-bold text-sm md:text-base truncate max-w-xs md:max-w-xl">{{ file_name }}</h1>
        </div>
        <div class="flex items-center space-x-2">
            <a href="{{ download_url }}" class="inline-flex items-center space-x-2 px-4 py-2 rounded-xl bg-sky-500 hover:bg-sky-600 text-slate-950 font-bold text-sm transition shadow-lg shadow-sky-500/20">
                <i class="fa-solid fa-download"></i>
                <span>Fast Download</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center justify-center p-3 sm:p-6 max-w-5xl mx-auto w-full">
        <!-- Video Container -->
        <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-slate-800 mb-6">
            <video id="videoPlayer" class="w-full h-full object-contain" controls playsinline preload="metadata">
                <source src="{{ stream_url }}" type="video/mp4">
                Your browser does not support HTML5 video streaming.
            </video>
        </div>

        <!-- 4 External Players Panel -->
        <div class="w-full bg-slate-900/70 border border-slate-800 rounded-2xl p-5 shadow-xl">
            <h2 class="text-sm font-bold text-sky-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                <i class="fa-solid fa-bolt"></i> Play in 4 External Apps (12 MB/s Super-Sonic Speed)
            </h2>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <!-- 1. MX Player -->
                <a href="{{ mx_url }}" class="flex items-center justify-center gap-2.5 p-3.5 rounded-xl bg-slate-800/80 hover:bg-sky-500 hover:text-slate-950 transition border border-slate-700/60 font-semibold text-xs md:text-sm">
                    <i class="fa-solid fa-film text-sky-400"></i>
                    <span>MX Player</span>
                </a>
                <!-- 2. VLC Player -->
                <a href="{{ vlc_url }}" class="flex items-center justify-center gap-2.5 p-3.5 rounded-xl bg-slate-800/80 hover:bg-orange-500 hover:text-slate-950 transition border border-slate-700/60 font-semibold text-xs md:text-sm">
                    <i class="fa-solid fa-traffic-light text-orange-400"></i>
                    <span>VLC Player</span>
                </a>
                <!-- 3. PLAYit -->
                <a href="{{ playit_url }}" class="flex items-center justify-center gap-2.5 p-3.5 rounded-xl bg-slate-800/80 hover:bg-emerald-500 hover:text-slate-950 transition border border-slate-700/60 font-semibold text-xs md:text-sm">
                    <i class="fa-solid fa-circle-play text-emerald-400"></i>
                    <span>PLAYit</span>
                </a>
                <!-- 4. KMPlayer -->
                <a href="{{ kmplayer_url }}" class="flex items-center justify-center gap-2.5 p-3.5 rounded-xl bg-slate-800/80 hover:bg-purple-500 hover:text-slate-950 transition border border-slate-700/60 font-semibold text-xs md:text-sm">
                    <i class="fa-solid fa-compact-disc text-purple-400"></i>
                    <span>KMPlayer</span>
                </a>
            </div>

            <!-- Copy Stream URL Button -->
            <div class="mt-4 pt-4 border-t border-slate-800/80 flex flex-wrap items-center justify-between gap-3 text-xs text-slate-400">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>12 MB/s HTTP 206 Streaming Engine Active</span>
                </div>
                <button onclick="copyStreamUrl('{{ stream_url }}')" class="px-3.5 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 transition font-medium flex items-center gap-2">
                    <i class="fa-regular fa-copy"></i>
                    <span>Copy Stream Link</span>
                </button>
            </div>
        </div>

        <footer class="mt-6 text-xs text-slate-500 text-center">
            ⚡ Powered by <a href="{{ watermark_url }}" target="_blank" class="text-sky-400 font-semibold">{{ watermark }}</a>
        </footer>
    </main>

    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-emerald-600 text-white font-bold text-xs py-2.5 px-5 rounded-xl shadow-2xl opacity-0 pointer-events-none transition-opacity duration-300">
        Stream URL Copied!
    </div>

    <script>
        function copyStreamUrl(url) {
            navigator.clipboard.writeText(url).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.remove('opacity-0', 'pointer-events-none');
                setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 2500);
            });
        }
    </script>
</body>
</html>
