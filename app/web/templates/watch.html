<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 {{ file_name }} - {{ watermark }}</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07090e;
            --surface: #0f141c;
            --surface-card: #141a24;
            --border: #1e2636;
            --accent: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            --accent-glow: rgba(56, 189, 248, 0.2);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            background-image: radial-gradient(circle at top, rgba(56, 189, 248, 0.08) 0%, transparent 60%);
        }
        .container {
            width: 100%;
            max-width: 980px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            padding: 16px 28px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }
        .brand {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--accent);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tag {
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.25);
            color: var(--accent);
            padding: 5px 16px;
            border-radius: 9999px;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .player-wrapper {
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px -15px rgba(0, 0, 0, 0.7);
        }
        .meta-card {
            background: var(--surface);
            padding: 24px 28px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }
        .meta-title {
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 12px;
            word-break: break-all;
            line-height: 1.4;
        }
        .meta-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 0.92rem;
            color: var(--text-secondary);
        }
        .meta-tag-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .grid-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 18px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.92rem;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }
        .btn-primary {
            background: var(--accent-gradient);
            color: #07090e;
            box-shadow: 0 8px 20px -5px var(--accent-glow);
        }
        .btn-primary:hover { transform: translateY(-2px); opacity: 0.92; }
        .btn-secondary {
            background: var(--surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background: var(--surface-card);
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        footer {
            margin-top: auto;
            padding: 28px;
            font-size: 0.88rem;
            color: var(--text-secondary);
            text-align: center;
        }
        footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="{{ watermark_url }}" class="brand" target="_blank">⚡ {{ watermark }}</a>
            <span class="tag">✦ ᴜʟᴛʀᴀ-ғᴀsᴛ sᴛʀᴇᴀᴍ ✦</span>
        </header>

        <div class="player-wrapper">
            <video id="player" playsinline controls>
                <source src="{{ stream_url }}" type="{{ mime_type }}" />
            </video>
        </div>

        <div class="meta-card">
            <h1 class="meta-title">📁 {{ file_name }}</h1>
            <div class="meta-tags">
                <div class="meta-tag-item">📦 <span>sɪᴢᴇ : <b>{{ file_size }}</b></span></div>
                <div class="meta-tag-item">🏷️ <span>ᴛʏᴘᴇ : <b>{{ mime_type }}</b></span></div>
                <div class="meta-tag-item">⚡ <span>ᴘᴏᴡᴇʀᴇᴅ ʙʏ : <a href="{{ watermark_url }}" target="_blank" style="color: var(--accent); text-decoration: none;"><b>{{ watermark }}</b></a></span></div>
            </div>
        </div>

        <div class="grid-buttons">
            <a href="{{ download_url }}" class="btn btn-primary">⬇️ ᴅᴏᴡɴʟᴏᴀᴅ ғɪʟᴇ</a>
            <a href="{{ stream_url }}" class="btn btn-secondary" target="_blank" rel="noopener">▶️ ᴏᴘᴇɴ sᴛʀᴇᴀᴍ</a>
            <a href="{{ download_url }}" class="btn btn-secondary">⬇️ ᴅᴏᴡɴʟᴏᴀᴅ</a>
            <button onclick="copyStreamLink()" class="btn btn-secondary" id="copyBtn">📋 ᴄᴏᴘʏ ʟɪɴᴋ</button>
        </div>
    </div>

    <footer>
        <p>⚡ ᴍᴍᴡ sᴜᴘᴇʀ sᴏɴɪᴄ ᴘʀᴏ ᴇɴɢɪɴᴇ • <a href="{{ watermark_url }}" target="_blank">{{ watermark }}</a></p>
    </footer>

    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script>
        const player = new Plyr('#player', {
            controls: ['play-large', 'restart', 'rewind', 'play', 'fast-forward', 'progress', 'current-time', 'duration', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'],
            speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] }
        });

        function copyStreamLink() {
            navigator.clipboard.writeText("{{ stream_url }}").then(() => {
                const btn = document.getElementById("copyBtn");
                btn.innerText = "✅ ᴄᴏᴘɪᴇᴅ!";
                setTimeout(() => { btn.innerText = "📋 ᴄᴏᴘʏ ʟɪɴᴋ"; }, 2000);
            });
        }
    </script>
</body>
</html>
